name: Dijagnostika

on:
  workflow_dispatch:

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Pokreni AutoScout test
        run: python autoscout_test.py
