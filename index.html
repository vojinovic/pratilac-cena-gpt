<!DOCTYPE html>
<html>
<head>
    <title>Pracenje Oglasa</title>

    <style>
        body { font-family: Arial; background:#f6f6f6; }

        #topDeals, #list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .card, .top-card {
            background: white;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid orange;
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .no-img {
            height: 180px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#eee;
        }

        .badge { color:red; font-weight:bold; }
    </style>
</head>

<body>

<h2>🚗 Praceni oglasi</h2>

<!-- 🔥 OVO JE KLJUČ -->
<div id="topDeals"></div>
<div id="list"></div>

<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

let DATA = {};

async function load(){
    const r = await fetch(API + "/data");
    DATA = await r.json();
    render();
}

function img(src){
    if(!src) return `<div class="no-img">No Image</div>`;
    return `<img src="${src}" onerror="this.src='https://via.placeholder.com/400x250'">`;
}

function render(){

    const oglasi = DATA?.oglasi || [];
    const cene = DATA?.cene || {};

    const list = oglasi.sort((a,b)=>
        (cene[b.url]?.score||0)-(cene[a.url]?.score||0)
    );

    // TOP 3
    const top = document.getElementById("topDeals");
    top.innerHTML = "";

    list.slice(0,3).forEach(o=>{
        const c = cene[o.url]||{};
        const div = document.createElement("div");
        div.className="top-card";

        div.innerHTML = `
            <div class="badge">🔥 BEST DEAL</div>
            ${img(c.slika)}
            <h3>${o.label}</h3>
            <b>${c.cena} €</b><br>
            Score: ${c.score||0}
        `;

        top.appendChild(div);
    });

    // LIST
    const container = document.getElementById("list");
    container.innerHTML="";

    list.forEach(o=>{
        const c = cene[o.url]||{};
        const div = document.createElement("div");
        div.className="card";

        div.innerHTML = `
            ${img(c.slika)}
            <h4>${o.label}</h4>
            <b>${c.cena} €</b><br>
            Score: ${c.score||0}<br>
            <a href="${o.url}" target="_blank">Otvori</a>
        `;

        container.appendChild(div);
    });
}

load();
</script>

</body>
</html>
