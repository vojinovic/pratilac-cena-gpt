<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Auto Drukara</title>

<style>
    *{box-sizing:border-box;}

    body{
        margin:0;
        padding:24px;
        font-family:Arial,sans-serif;
        background:#f4f4f6;
        color:#1d1d1f;
    }

    .container{
        max-width:760px;
        margin:0 auto;
    }

    h1{
        font-size:34px;
        margin-bottom:8px;
    }

    .subtitle{
        color:#666;
        margin-bottom:28px;
    }

    .box{
        background:#fff;
        padding:20px;
        border-radius:20px;
        margin-bottom:22px;
        box-shadow:0 2px 8px rgba(0,0,0,.05);
    }

    input{
        width:100%;
        padding:14px;
        border-radius:14px;
        border:1px solid #ddd;
        margin-bottom:14px;
        font-size:16px;
    }

    button{
        border:none;
        border-radius:14px;
        padding:12px 18px;
        font-weight:700;
        cursor:pointer;
    }

    .primary-btn{
        background:#5b4ce6;
        color:#fff;
    }

    .filter-wrap{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:14px;
    }

    .filter-btn{
        background:#ececec;
        padding:10px 14px;
        border-radius:999px;
        font-weight:700;
        font-size:14px;
    }

    .filter-btn.active{
        background:#5b4ce6;
        color:#fff;
    }

    .oglas-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:18px;
    }

    .badge{
        background:#efeaff;
        color:#5b4ce6;
        padding:6px 10px;
        border-radius:999px;
        font-size:13px;
        font-weight:700;
    }

    /* SORT UI */
    .sort-row{
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:18px;
    }

    .sort-label{
        font-size:14px;
        font-weight:700;
        color:#666;
    }

    select{
        appearance:none;
        background:#fff;
        border:1px solid #ddd;
        border-radius:999px;
        padding:11px 40px 11px 16px;
        font-size:14px;
        font-weight:700;
        cursor:pointer;
        min-width:220px;

        background-image:
            linear-gradient(45deg, transparent 50%, #555 50%),
            linear-gradient(135deg, #555 50%, transparent 50%);
        background-position:
            calc(100% - 18px) 50%,
            calc(100% - 13px) 50%;
        background-size:5px 5px, 5px 5px;
        background-repeat:no-repeat;
    }

    select:focus{
        outline:none;
        border-color:#5b4ce6;
        box-shadow:0 0 0 3px rgba(91,76,230,.15);
    }

    .oglas-card{
        background:#fafafa;
        border:1px solid #e7e7e7;
        border-radius:18px;
        padding:16px;
        margin-bottom:16px;
    }

    .oglas-card.neaktivan{
        background:#fff3f3;
        border-color:#ffb4b4;
        opacity:.8;
    }

    .oglas-link{
        font-size:17px;
        font-weight:700;
        color:#483dff;
        text-decoration:none;
    }

    .status{
        display:inline-block;
        margin-top:8px;
        padding:6px 10px;
        border-radius:999px;
        font-size:12px;
        font-weight:700;
    }

    .status.active{
        background:#e8fff1;
        color:#138a47;
    }

    .status.inactive{
        background:#ffe3e3;
        color:#d92d20;
    }

    .cena{
        font-size:18px;
        font-weight:800;
        color:#0a8f3d;
        margin-top:8px;
    }

    .stara-cena{
        margin-top:6px;
        font-size:14px;
        color:#666;
    }

    .pad{color:#d92d20;font-weight:700;}
    .rast{color:#0a8f3d;font-weight:700;}

    .stats-box{
        margin-top:12px;
        padding:12px;
        border-radius:12px;
        background:#f1f3f5;
        font-size:14px;
        line-height:1.6;
    }

    .datum{
        margin-top:10px;
        font-size:13px;
        color:#777;
    }

    .delete-btn{
        background:#ffdede;
        color:#e02424;
        border-radius:12px;
        padding:10px 14px;
    }

    .empty{
        color:#777;
    }

</style>
</head>

<body>

<div class="container">

    <h1>🚗 Auto Drukara</h1>
    <div class="subtitle">Prati cene i promene oglasa</div>

    <div class="box">
        <input id="url" placeholder="URL oglasa"/>
        <input id="label" placeholder="Naziv (opciono)"/>
        <button class="primary-btn" onclick="dodajOglas()">Dodaj oglas</button>
    </div>

    <div class="box">

        <div class="oglas-header">
            <h2>Praćeni oglasi</h2>
            <div class="badge" id="count">0</div>
        </div>

        <div class="filter-wrap">
            <button class="filter-btn active" onclick="setFilter('all', this)">Svi</button>
            <button class="filter-btn" onclick="setFilter('active', this)">Aktivni</button>
            <button class="filter-btn" onclick="setFilter('inactive', this)">Nestali</button>
            <button class="filter-btn" onclick="setFilter('changes', this)">Sa promenom</button>
        </div>

        <div class="sort-row">
            <span class="sort-label">Sortiraj:</span>
            <select id="sortSelect" onchange="render()">
                <option value="default">Podrazumevano</option>
                <option value="biggestDrop">🔥 Najveći pad</option>
                <option value="lowestPrice">💸 Najjeftiniji</option>
                <option value="latest">🆕 Poslednje provereni</option>
            </select>
        </div>

        <div id="oglasi"></div>
    </div>

</div>

<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

let FILTER = "all";
let DATA = null;

function formatCena(c){
    if(c === null || c === undefined) return "N/A";
    return new Intl.NumberFormat("sr-RS").format(c) + " €";
}

function formatProcenat(p, old){
    if(!p || !old) return "";
    return ((p / old) * 100).toFixed(1) + "%";
}

function setFilter(f, btn){
    FILTER = f;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
}

async function load(){
    const r = await fetch(API + "/data");
    DATA = await r.json();
    render();
}

function render(){

    const oglasi = DATA?.oglasi || [];
    const cene = DATA?.cene || {};

    let list = oglasi.filter(o=>{
        const c = cene[o.url] || {};

        if(FILTER==="active") return c.aktivan !== false;
        if(FILTER==="inactive") return c.aktivan === false;
        if(FILTER==="changes") return c.prethodna_cena;

        return true;
    });

    const sort = document.getElementById("sortSelect").value;

    if(sort==="biggestDrop"){
        list.sort((a,b)=>{
            const A = cene[a.url]||{};
            const B = cene[b.url]||{};
            return (B.ukupno_snizenje||0)-(A.ukupno_snizenje||0);
        });
    }

    if(sort==="lowestPrice"){
        list.sort((a,b)=>{
            const A = cene[a.url]||{};
            const B = cene[b.url]||{};
            return (A.cena||999999)-(B.cena||999999);
        });
    }

    if(sort==="latest"){
        list.sort((a,b)=>{
            const A = cene[a.url]||{};
            const B = cene[b.url]||{};
            return (B.poslednja_provera||"").localeCompare(A.poslednja_provera||"");
        });
    }

    document.getElementById("count").innerText = list.length;

    const wrap = document.getElementById("oglasi");

    if(!list.length){
        wrap.innerHTML = `<div class="empty">Nema oglasa.</div>`;
        return;
    }

    wrap.innerHTML = "";

    list.forEach(o=>{

        const c = cene[o.url]||{};
        const name = o.label || c.label || "Oglas";

        let change = "";

        if(c.prethodna_cena){
            change = `
                <div class="stara-cena">
                    Pre: ${formatCena(c.prethodna_cena)}
                    ${c.promena_tip==="snizenje"
                        ? `<span class="pad">↓ ${formatCena(Math.abs(c.promena))} (-${formatProcenat(Math.abs(c.promena),c.prethodna_cena)})</span>`
                        : `<span class="rast">↑ ${formatCena(c.promena)} (+${formatProcenat(c.promena,c.prethodna_cena)})</span>`
                    }
                </div>
            `;
        } else {
            change = `<div class="stara-cena">Nema promene</div>`;
        }

        wrap.innerHTML += `
            <div class="oglas-card ${c.aktivan===false?"neaktivan":""}">

                <a class="oglas-link" href="${o.url}" target="_blank">${name}</a>

                <div class="status ${c.aktivan===false?"inactive":"active"}">
                    ${c.aktivan===false?"Nestao":"Aktivan"}
                </div>

                <div class="cena">${formatCena(c.cena)}</div>

                ${change}

                <div class="stats-box">
                    Prva: ${formatCena(c.prva_cena)}<br>
                    Najniža: ${formatCena(c.najmanja_cena)}<br>
                    Promena: ${c.broj_promena||0}<br>
                    Ukupno: ${formatCena(c.ukupno_snizenje||0)}
                </div>

                <div class="datum">
                    Poslednja provera: ${c.poslednja_provera || "-"}
                </div>

                <button class="delete-btn" onclick="deleteItem('${o.url}')">Obriši</button>
            </div>
        `;
    });
}

async function dodajOglas(){
    const url = document.getElementById("url").value.trim();
    const label = document.getElementById("label").value.trim();

    if(!url) return alert("Unesi URL");

    await fetch(API+"/add",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url,label})
    });

    document.getElementById("url").value="";
    document.getElementById("label").value="";

    load();
}

async function deleteItem(url){
    await fetch(API+"/delete",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url})
    });

    load();
}

load();
</script>

</body>
</html>
