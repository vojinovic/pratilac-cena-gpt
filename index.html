<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

.container {

}

.logo {

.search-box {

.search-grid {

.search-info-row {

.filter-btn {

<body>

<div class="container">

    <div class="header">
        <div class="logo">
            <img src="images/logo-mark.png" alt="Auto Drukara" class="logo-mark-img">
            <div class="logo-text">
                <div class="logo-name">Auto <span class="name-red">Drukara</span></div>
                <div class="logo-sub">Mi nađemo. Ti uštediš.</div>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showSection('tracked', event)">Praćeni oglasi</button>
        <button class="tab" onclick="showSection('search', event)">Pretraga</button>
    </div>

    <div id="section-tracked" class="section active">

        <div class="add-box">
            <input id="urlInput" placeholder="URL oglasa sa polovniautomobili.com">
            <input id="labelInput" placeholder="Naziv (opciono)">
            <button class="add-btn" onclick="addOglas()">Dodaj oglas</button>
        </div>

        <div class="filters" id="filtersContainer">
            <button class="filter-btn active" onclick="setFilter('all', event)">Svi <span class="filter-count" id="count-all">0</span></button>
            <button class="filter-btn" onclick="setFilter('top', event)">🔥 Top ponude <span class="filter-count" id="count-top">0</span></button>
            <button class="filter-btn" onclick="setFilter('active', event)">Aktivni <span class="filter-count" id="count-active">0</span></button>
            <button class="filter-btn" onclick="setFilter('changes', event)">Sa promenom <span class="filter-count" id="count-changes">0</span></button>
            <button class="filter-btn" onclick="setFilter('inactive', event)">Nestali <span class="filter-count" id="count-inactive">0</span></button>
            <button class="filter-btn" onclick="setFilter('problem', event)">Problem <span class="filter-count" id="count-problem">0</span></button>
        </div>

        <div id="list"></div>
        <div id="emptyState" class="empty-state" style="display:none;">Nema oglasa za prikaz u ovom filteru.</div>
    </div>

    <div id="section-search" class="section">

        <div class="search-box">
            <div class="search-grid">
                <div class="autocomplete">
                    <input id="brandInput" placeholder="Brend" autocomplete="off">
                    <div class="autocomplete-list" id="brandList"></div>
                </div>
                <div class="autocomplete">
                    <input id="modelInput" placeholder="Model" autocomplete="off" disabled>
                    <div class="autocomplete-list" id="modelList"></div>
                </div>
                <input id="yearFromInput" type="number" placeholder="Godište od">
                <input id="yearToInput" type="number" placeholder="Godište do">
                <input id="priceToInput" type="number" placeholder="Max cena (€)">
            </div>
            <button class="search-btn" id="searchBtn" onclick="doSearch()">Pretraži</button>
        </div>

        <div class="search-info-row">
            <div id="searchInfo" class="search-info"></div>
            <div class="sort-control" id="sortControl" style="display:none;">
                <label>Sortiraj:</label>
                <select id="sortSelect" onchange="renderSearch()">
                    <option value="newest">Najnoviji</option>
                    <option value="score">Najveći score</option>
                    <option value="price">Najjeftiniji</option>
                    <option value="km">Najmanje km</option>
                    <option value="year">Najmlađi godište</option>
                </select>
            </div>
        </div>

        <div id="searchResults"></div>

        <div id="searchPagination" class="pagination"></div>
    </div>

</div>


<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

let DATA = {};
let FILTER = "all";

let SEARCH_DATA = null;
let SEARCH_RESULTS_WITH_SCORE = [];

let BRANDS = [];
let MODELS = [];
let SELECTED_BRAND = null;
let SELECTED_MODEL = null;

function showSection(name, event){
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));

    if(event && event.target){
        event.target.classList.add("active");
    }

    document.getElementById("section-" + name).classList.add("active");
}

async function loadBrands(){
    try{
        const r = await fetch(API + "/brands");
        const data = await r.json();
        BRANDS = data.brands || [];
    }catch(e){
        console.error(e);
    }
}

async function loadModels(brandValue){
    try{
        const r = await fetch(API + "/models?brand=" + encodeURIComponent(brandValue));
        const data = await r.json();
        MODELS = data.models || [];
    }catch(e){
        console.error(e);
        MODELS = [];
    }
}

function filterItems(items, query){
    if(!query) return items;
    const q = query.toLowerCase();
    return items.filter(item => item.label.toLowerCase().includes(q));
}

function renderAutocompleteList(listEl, items, onSelect){
    listEl.innerHTML = "";

    if(items.length === 0){
        const empty = document.createElement("div");
        empty.className = "autocomplete-empty";
        empty.textContent = "Nema rezultata";
        listEl.appendChild(empty);
        return;
    }

    items.forEach(item => {
        const div = document.createElement("div");
        div.className = "autocomplete-item";
        div.textContent = item.label;
        div.onclick = () => onSelect(item);
        listEl.appendChild(div);
    });
}

function setupAutocomplete(inputId, listId, getItems, onSelect){
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);

    input.addEventListener("focus", () => {
        const items = filterItems(getItems(), input.value);
        renderAutocompleteList(list, items, onSelect);
        list.classList.add("open");
    });

    input.addEventListener("input", () => {
        const items = filterItems(getItems(), input.value);
        renderAutocompleteList(list, items, onSelect);
        list.classList.add("open");

        if(inputId === "brandInput" && input.value === ""){
            SELECTED_BRAND = null;
            SELECTED_MODEL = null;
            const modelInput = document.getElementById("modelInput");
            modelInput.value = "";
            modelInput.disabled = true;
            MODELS = [];
        }

        if(inputId === "modelInput" && input.value === ""){
            SELECTED_MODEL = null;
        }
    });

    document.addEventListener("click", (e) => {
        if(!input.contains(e.target) && !list.contains(e.target)){
            list.classList.remove("open");
        }
    });
}

function selectBrand(item){
    SELECTED_BRAND = item;
    SELECTED_MODEL = null;

    const brandInput = document.getElementById("brandInput");
    const brandList = document.getElementById("brandList");

        DATA = await r.json();
        render();
    }catch(e){
        console.error(e);

function getName(o, c){
    return o.label || c.label || "Oglas";
}

function formatPrice(value){
    if(value === null || value === undefined || value === "") return "—";
    return Number(value).toLocaleString("sr-RS") + " €";
}

function formatKm(value){
    if(value === null || value === undefined) return null;
    return Number(value).toLocaleString("sr-RS") + " km";
}

function daysFromIsoDate(isoDate){
    if(!isoDate) return null;
    const date = new Date(isoDate.replace(" ", "T"));
    if(isNaN(date.getTime())) return null;
    const now = new Date();
    const diffMs = now - date;
    return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

function setFilter(f, event){

    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    if(event && event.target){

    }

}

async function addOglas(){

async function addOglasByUrl(url, label){
    try{
        const r = await fetch(API + "/add", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({url:url, label:label || ""})
        });

        const data = await r.json();

            return false;

async function deleteOglas(url){

    }

        const r = await fetch(API + "/delete", {
            method:"POST",
            headers:{"Content-Type":"application/json"},

        });

function passesFilter(c, filterName){
    if(filterName === "all") return true;
    if(filterName === "top") return (c.score || 0) >= 80;
    if(filterName === "active") return c.aktivan !== false;
    if(filterName === "inactive") return c.aktivan === false;
    if(filterName === "changes") return c.broj_promena && c.broj_promena > 0;
    if(filterName === "problem") return c.problem_cena === true;
    return true;
}

function updateFilterCounts(){
    const oglasi = DATA?.oglasi || [];
    const cene = DATA?.cene || {};

    const filters = ["all", "top", "active", "inactive", "changes", "problem"];

    filters.forEach(f => {
        const count = oglasi.filter(o => {
            const c = cene[o.url] || {};
            return passesFilter(c, f);
        }).length;
        const el = document.getElementById("count-" + f);
        if(el) el.textContent = count;
    });
}

                t.textContent = "Best deal";

    }else{

        bestTag.textContent = "Best deal";

    const scoreBadge = document.createElement("div");
    scoreBadge.className = "score-badge";
    scoreBadge.textContent = `${badge} ${score}`;

    card.appendChild(imgWrap);

    const body = document.createElement("div");
    body.className = "card-body";

    if(c.problem_cena){

        pb.className = "problem-badge";

    if(indicators.length > 0){

    const specs = [];

    if(c.promena && c.promena !== 0){

        }else if(daysRenewed <= 30){

        }else if(daysRenewed <= 60){
            renewText = `stoji ${daysRenewed}d`;

        }else{
            renewText = `stoji ${daysRenewed}d`;

    if(daysTracked !== null && daysTracked > 0){

    body.appendChild(actions);
    card.appendChild(body);

    return card;
}

function render(){
    const oglasi = DATA?.oglasi || [];
    const cene = DATA?.cene || {};

    updateFilterCounts();

    let list = oglasi.filter(o => {
        const c = cene[o.url] || {};
        return passesFilter(c, FILTER);
    });

    list.sort((a,b)=>{
        return (cene[b.url]?.score || 0) - (cene[a.url]?.score || 0);
    });

    const container = document.getElementById("list");
    const emptyState = document.getElementById("emptyState");

    container.innerHTML = "";

    if(list.length === 0){
        container.style.display = "none";
        emptyState.style.display = "block";
        return;
    }

    container.style.display = "grid";
    emptyState.style.display = "none";

    const topUrl = (list[0] && (cene[list[0].url]?.score || 0) >= 80) ? list[0].url : null;

    list.forEach(o=>{
        const c = cene[o.url] || {};
        const isBestDeal = o.url === topUrl;
        container.appendChild(buildTrackedCard(o, c, isBestDeal));
    });
}

function isAlreadyTracked(url){
    if(!DATA?.oglasi) return false;
    const cleanUrl = url.split("?")[0];
    return DATA.oglasi.some(o => o.url.split("?")[0] === cleanUrl);
}

function daysSinceRenew(renewdate){
    if(!renewdate) return null;
    const date = new Date(renewdate.replace(" ", "T"));
    if(isNaN(date.getTime())) return null;
    const now = new Date();
    const diffMs = now - date;
    return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

function buildHybridStats(searchResults, brandValue, modelValue){
    const cene = [];
    const kms = [];
    const godine = [];

    searchResults.forEach(r => {
        if(r.cena) cene.push(r.cena);
        if(r.kilometraza) kms.push(r.kilometraza);
        if(r.godina) godine.push(r.godina);
    });

    if(brandValue && modelValue && DATA?.cene){
        const targetModel = brandValue + "-" + modelValue;
        Object.values(DATA.cene).forEach(c => {
            if(c.model === targetModel){
                if(c.cena) cene.push(c.cena);
                if(c.kilometraza) kms.push(c.kilometraza);
                if(c.godiste) godine.push(c.godiste);
            }
        });
    }

    const avg = arr => arr.length > 0 ? arr.reduce((a,b)=>a+b,0) / arr.length : null;

    return {
        avgCena: avg(cene),
        avgKm: avg(kms),
        avgGod: avg(godine),
        sampleSize: cene.length
    };
}

function calculateSearchScore(result, stats){
    const text = (result.naslov || "").toLowerCase();
    let score = 50;

    if(stats.avgCena && result.cena){
        const diffPercent = ((stats.avgCena - result.cena) / stats.avgCena) * 100;
        if(diffPercent >= 15) score += 20;
        else if(diffPercent >= 10) score += 15;
        else if(diffPercent >= 5) score += 8;
        else if(diffPercent <= -15) score -= 20;
        else if(diffPercent <= -10) score -= 10;
    }

    if(stats.avgKm && result.kilometraza){
        const ratio = result.kilometraza / stats.avgKm;
        if(ratio <= 0.5) score += 15;
        else if(ratio <= 0.75) score += 8;
        else if(ratio <= 0.9) score += 3;
        else if(ratio >= 1.5) score -= 10;
        else if(ratio >= 1.25) score -= 5;
    }

    if(stats.avgGod && result.godina){
        const diff = result.godina - stats.avgGod;
        if(diff >= 2) score += 10;
        else if(diff >= 1) score += 5;
        else if(diff <= -2) score -= 8;
        else if(diff <= -1) score -= 3;
    }

    const plusKeywords = {
        "awd": 5, "4x4": 5, "r-design": 5, "inscription": 5,
        "momentum": 3, "sport": 4, "pano": 5, "panorama": 5,
        "kamera": 3, "matrix": 4, "harman": 3, "bowers": 4,
    };

    for(const [kw, pts] of Object.entries(plusKeywords)){
        if(text.includes(kw)) score += pts;
    }

    const minusKeywords = {
        "udaren": -25, "ostecen": -20, "oštećen": -20,
        "hitno": -5, "zamena": -5,
    };

    for(const [kw, pts] of Object.entries(minusKeywords)){
        if(text.includes(kw)) score += pts;
    }

    const days = daysSinceRenew(result.renewdate);
    let ageStatus = null;

    if(days !== null){
        if(days <= 7){
            score += 5;
            ageStatus = "fresh";
        }else if(days <= 30){
            ageStatus = "normal";
        }else if(days <= 60){
            score -= 3;
            ageStatus = "stale";
        }else{
            score -= 8;
            ageStatus = "old";
        }
    }

    let outlier = false;
    if(stats.avgCena && result.cena){
        const diffPercent = ((stats.avgCena - result.cena) / stats.avgCena) * 100;
        if(diffPercent >= 25){
            const hasNegative = Object.keys(minusKeywords).some(kw => text.includes(kw));
            const highKm = stats.avgKm && result.kilometraza && (result.kilometraza / stats.avgKm) > 1.4;
            if(hasNegative || highKm) outlier = true;
        }
    }

    if(score > 100) score = 100;
    if(score < 0) score = 0;
    if(outlier && score > 65) score = 65;

    return {
        score: Math.round(score),
        ageStatus,
        ageDays: days,
        outlier
    };
}

async function doSearch(page = 1){
    if(!SELECTED_BRAND){
        alert("Izaberi brend iz liste.");
        return;
    }

    const yearFrom = document.getElementById("yearFromInput").value.trim();
    const yearTo = document.getElementById("yearToInput").value.trim();
    const priceTo = document.getElementById("priceToInput").value.trim();

    const params = new URLSearchParams();
    params.set("brand", SELECTED_BRAND.value);
    if(SELECTED_MODEL) params.set("model", SELECTED_MODEL.value);
    if(yearFrom) params.set("year_from", yearFrom);
    if(yearTo) params.set("year_to", yearTo);
    if(priceTo) params.set("price_to", priceTo);
    if(page > 1) params.set("page", page);

    const btn = document.getElementById("searchBtn");
    btn.disabled = true;
    btn.textContent = "Pretražujem...";

    document.getElementById("searchInfo").textContent = "";
    document.getElementById("searchResults").innerHTML = "";
    document.getElementById("searchPagination").innerHTML = "";
    document.getElementById("sortControl").style.display = "none";

    try{
        const r = await fetch(API + "/search?" + params.toString());
        const data = await r.json();

        if(!r.ok || data.error){
            alert(data.error || "Greška pri pretrazi.");
            return;
        }

        SEARCH_DATA = data;

        const stats = buildHybridStats(
            data.results,
            SELECTED_BRAND ? SELECTED_BRAND.value : "",
            SELECTED_MODEL ? SELECTED_MODEL.value : ""
        );

        SEARCH_RESULTS_WITH_SCORE = data.results.map(r => {
            const scoreInfo = calculateSearchScore(r, stats);
            return {
                ...r,
                ...scoreInfo,
                _stats: stats
            };
        });

        renderSearch();

    }catch(e){
        console.error(e);
        alert("Greška pri pretrazi.");
    }finally{
        btn.disabled = false;
        btn.textContent = "Pretraži";
    }
}

function getSortedResults(){
    const sortBy = document.getElementById("sortSelect").value;
    const arr = [...SEARCH_RESULTS_WITH_SCORE];

    switch(sortBy){
        case "score":
            arr.sort((a,b) => (b.score || 0) - (a.score || 0));
            break;
        case "price":
            arr.sort((a,b) => (a.cena || Infinity) - (b.cena || Infinity));
            break;
        case "km":
            arr.sort((a,b) => (a.kilometraza || Infinity) - (b.kilometraza || Infinity));
            break;
        case "year":
            arr.sort((a,b) => (b.godina || 0) - (a.godina || 0));
            break;
        case "newest":
        default:
            arr.sort((a,b) => {
                const da = a.renewdate ? new Date(a.renewdate.replace(" ", "T")).getTime() : 0;
                const db = b.renewdate ? new Date(b.renewdate.replace(" ", "T")).getTime() : 0;
                return db - da;
            });
            break;
    }

    return arr;
}

    const info = document.getElementById("searchInfo");
    const container = document.getElementById("searchResults");
    const pagination = document.getElementById("searchPagination");
    const sortControl = document.getElementById("sortControl");

    const stats = SEARCH_RESULTS_WITH_SCORE[0]?._stats;

    if(stats && stats.avgCena){
        infoHtml += ` Prosek: <strong>${Math.round(stats.avgCena).toLocaleString("sr-RS")} €</strong>`;
        if(stats.avgKm){
            infoHtml += ` · <strong>${Math.round(stats.avgKm).toLocaleString("sr-RS")} km</strong>`;
        }

    });

    pagination.innerHTML = "";
    const total = data.total || 0;
    const totalPages = Math.ceil(total / 25);
    const currentPage = data.page;

    if(totalPages > 1){
        if(currentPage > 1){
            const prev = document.createElement("button");
            prev.textContent = "← Prethodna";
            prev.onclick = () => doSearch(currentPage - 1);
            pagination.appendChild(prev);
        }

        const pageInfo = document.createElement("span");
        pageInfo.textContent = `Stranica ${currentPage} od ${totalPages}`;
        pagination.appendChild(pageInfo);

        if(currentPage < totalPages){
            const next = document.createElement("button");
            next.textContent = "Sledeća →";
            next.onclick = () => doSearch(currentPage + 1);
            pagination.appendChild(next);
        }
    }
}

async function trackFromSearch(url, label){
    const ok = await addOglasByUrl(url, label);
    if(ok){
        renderSearch();
    }
}

async function init(){
    await loadBrands();

    setupAutocomplete("brandInput", "brandList", () => BRANDS, selectBrand);
    setupAutocomplete("modelInput", "modelList", () => MODELS, selectModel);

    await load();
}

init();
</script>
