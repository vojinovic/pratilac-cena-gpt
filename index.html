<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Pratilac cena v2</title>

<style>
    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        padding:24px;
        background:#f4f4f6;
        font-family:Arial,sans-serif;
        color:#1d1d1f;
    }

    .container{
        max-width:760px;
        margin:0 auto;
    }

    h1{
        margin-bottom:8px;
        font-size:28px;
    }

    .subtitle{
        color:#666;
        margin-bottom:28px;
    }

    .box{
        background:#fff;
        border-radius:20px;
        padding:20px;
        margin-bottom:22px;
        box-shadow:0 2px 8px rgba(0,0,0,.05);
    }

    input{
        width:100%;
        padding:14px;
        border-radius:14px;
        border:1px solid #ddd;
        margin-bottom:14px;
        font-size:16px;
    }

    button{
        border:none;
        border-radius:14px;
        padding:12px 18px;
        cursor:pointer;
        font-size:15px;
        font-weight:700;
    }

    .primary-btn{
        background:#5b4ce6;
        color:#fff;
    }

    .oglas-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:18px;
    }

    .badge{
        background:#efeaff;
        color:#5b4ce6;
        padding:6px 10px;
        border-radius:999px;
        font-size:13px;
        font-weight:700;
    }

    .oglas-card{
        border:1px solid #e7e7e7;
        border-radius:18px;
        padding:16px;
        margin-bottom:16px;
        background:#fafafa;
    }

    .oglas-link{
        font-size:17px;
        font-weight:700;
        color:#483dff;
        text-decoration:none;
    }

    .cena{
        color:#0a8f3d;
        font-size:18px;
        font-weight:800;
        margin-top:8px;
    }

    .stara-cena{
        margin-top:6px;
        font-size:14px;
        color:#666;
    }

    .pad{
        color:#d92d20;
        font-weight:700;
    }

    .rast{
        color:#0a8f3d;
        font-weight:700;
    }

    .datum{
        margin-top:8px;
        color:#666;
        font-size:14px;
    }

    .delete-btn{
        background:#ffdede;
        color:#e02424;
        height:44px;
        min-width:86px;
    }

    .empty{
        color:#777;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🚗 Pratilac cena</h1>

    <div class="subtitle">
        Dodaj, prati i briši oglase bez GitHub tokena u browseru.
    </div>

    <div class="box">

        <input
            id="url"
            type="text"
            placeholder="https://www.polovniautomobili.com/auto-oglasi/..."
        >

        <input
            id="label"
            type="text"
            placeholder="Naziv oglasa"
        >

        <button class="primary-btn" onclick="dodajOglas()">
            Dodaj oglas
        </button>

    </div>

    <div class="box">

        <div class="oglas-header">
            <h2>Praćeni oglasi</h2>

            <div class="badge" id="count">
                0
            </div>
        </div>

        <div id="oglasi"></div>

    </div>

</div>

<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

function formatCena(cena){
    if(!cena) return "N/A";

    return new Intl.NumberFormat("sr-RS").format(cena) + " €";
}

async function ucitaj(){
    const res = await fetch(API);

    const data = await res.json();

    const wrapper = document.getElementById("oglasi");

    const oglasi = data.oglasi || [];

    const cene = data.cene || {};

    document.getElementById("count").innerText = oglasi.length;

    if(!oglasi.length){
        wrapper.innerHTML = `
            <div class="empty">
                Nema oglasa.
            </div>
        `;
        return;
    }

    wrapper.innerHTML = "";

    oglasi.forEach(oglas => {

        const item = cene[oglas.url] || {};

        let promenaHtml = "";

        if(item.prethodna_cena){

            if(item.promena_tip === "pad"){
                promenaHtml = `
                    <div class="stara-cena">
                        Pre: ${formatCena(item.prethodna_cena)}
                        <span class="pad">
                            ↓ ${formatCena(Math.abs(item.promena))}
                        </span>
                    </div>
                `;
            }

            else if(item.promena_tip === "rast"){
                promenaHtml = `
                    <div class="stara-cena">
                        Pre: ${formatCena(item.prethodna_cena)}
                        <span class="rast">
                            ↑ ${formatCena(item.promena)}
                        </span>
                    </div>
                `;
            }

            else{
                promenaHtml = `
                    <div class="stara-cena">
                        Pre: ${formatCena(item.prethodna_cena)}
                    </div>
                `;
            }

        } else {

            promenaHtml = `
                <div class="stara-cena">
                    Nema zabeležene promene
                </div>
            `;
        }

        wrapper.innerHTML += `

            <div class="oglas-card">

                ${item.slika ? `
                    <img
                        src="${item.slika}"
                        alt="${item.label}"
                        style="
                            width:100%;
                            height:180px;
                            object-fit:cover;
                            border-radius:14px;
                            margin-bottom:14px;
                        "
                    >
                ` : ""}

                <div style="display:flex;justify-content:space-between;gap:12px;">

                    <div>

                        <a
                            href="${oglas.url}"
                            target="_blank"
                            class="oglas-link"
                        >
                            ${oglas.label}
                        </a>

                        <div class="cena">
                            ${formatCena(item.cena)}
                        </div>

                        ${promenaHtml}

                        <div class="datum">
                            Poslednja provera:
                            ${item.poslednja_provera || "-"}
                        </div>

                    </div>

                    <button
                        class="delete-btn"
                        onclick="obrisiOglas('${oglas.url}')"
                    >
                        Obriši
                    </button>

                </div>

            </div>
        `;
    });
}

async function dodajOglas(){

    const url = document.getElementById("url").value.trim();

    const label = document.getElementById("label").value.trim();

    if(!url || !label){
        alert("Popuni oba polja");
        return;
    }

    await fetch(API + "/add", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            url,
            label
        })
    });

    document.getElementById("url").value = "";
    document.getElementById("label").value = "";

    ucitaj();
}

async function obrisiOglas(url){

    await fetch(API + "/delete", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            url
        })
    });

    ucitaj();
}

ucitaj();
</script>

</body>
</html>
