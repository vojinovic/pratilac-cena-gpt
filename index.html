<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

let DATA = {};
let FILTER = "all";

async function load(){
    const r = await fetch(API + "/data");
    DATA = await r.json();
    render();
}

function setFilter(f){
    FILTER = f;

    document.querySelectorAll(".filter-btn")
        .forEach(b => b.classList.remove("active"));

    document.querySelector(`[data-filter="${f}"]`)
        .classList.add("active");

    render();
}

function render(){

    const oglasi = DATA?.oglasi || [];
    const cene = DATA?.cene || {};

    // 1. FILTER
    let list = oglasi.filter(o => {
        const c = cene[o.url] || {};

        if(FILTER === "active") return c.aktivan !== false;
        if(FILTER === "inactive") return c.aktivan === false;
        if(FILTER === "changes") return c.prethodna_cena;

        return true;
    });

    // 2. SORT (BEST DEAL FIRST)
    list.sort((a, b) => {
        return (cene[b.url]?.score || 0) - (cene[a.url]?.score || 0);
    });

    // =========================
    // 🔥 TOP 3 DEALS
    // =========================
    const top3 = list.slice(0, 3);
    const topContainer = document.getElementById("topDeals");

    if (topContainer) {
        topContainer.innerHTML = "";

        top3.forEach(o => {
            const c = cene[o.url] || {};
            const score = c.score || 0;

            const card = document.createElement("div");
            card.className = "top-card";

            let badge = "⚪";
            if(score >= 80) badge = "🔥";
            else if(score >= 60) badge = "🟢";
            else if(score >= 40) badge = "🟡";
            else badge = "🔴";

            card.innerHTML = `
                <div class="badge">BEST DEAL</div>
                <img src="${c.slika || ""}" />
                
                <div class="title">
                    ${o.label || "Oglas"} ${badge}
                </div>

                <div class="price">
                    ${c.cena || "N/A"} €
                </div>

                <div class="score">
                    Score: ${score}/100
                </div>

                <a href="${o.url}" target="_blank">Otvori oglas</a>
            `;

            topContainer.appendChild(card);
        });
    }

    // =========================
    // FULL LIST
    // =========================
    const container = document.getElementById("list");
    container.innerHTML = "";

    list.forEach(o => {
        const c = cene[o.url] || {};

        const score = c.score || 0;

        let badge = "⚪";
        if(score >= 80) badge = "🔥";
        else if(score >= 60) badge = "🟢";
        else if(score >= 40) badge = "🟡";
        else badge = "🔴";

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <img src="${c.slika || ""}" />
            
            <div class="title">
                ${o.label || "Oglas"} ${badge}
            </div>

            <div class="price">
                ${c.cena || "N/A"} €
            </div>

            <div class="meta">
                Prva: ${c.prethodna_cena || "N/A"} € <br>
                Promena: ${c.promena || 0} € <br>
                Score: ${score}/100
            </div>

            <div class="date">
                Poslednja provera: ${c.poslednja_provera || "-"}
            </div>

            <a href="${o.url}" target="_blank">Otvori oglas</a>
        `;

        container.appendChild(div);
    });
}

// init
load();
</script>
