<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Auto Drukara</title>

<style>
    *{ box-sizing:border-box; }

    body{
        margin:0;
        padding:24px;
        background:#f4f4f6;
        font-family:Arial,sans-serif;
        color:#1d1d1f;
    }

    .container{
        max-width:760px;
        margin:0 auto;
    }

    h1{
        margin-bottom:8px;
        font-size:34px;
    }

    .subtitle{
        color:#666;
        margin-bottom:28px;
        line-height:1.5;
    }

    .box{
        background:#fff;
        border-radius:20px;
        padding:20px;
        margin-bottom:22px;
        box-shadow:0 2px 8px rgba(0,0,0,.05);
    }

    input{
        width:100%;
        padding:14px;
        border-radius:14px;
        border:1px solid #ddd;
        margin-bottom:14px;
        font-size:16px;
    }

    button{
        border:none;
        border-radius:14px;
        padding:12px 18px;
        cursor:pointer;
        font-size:15px;
        font-weight:700;
    }

    .primary-btn{
        background:#5b4ce6;
        color:#fff;
    }

    .filter-wrap{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:18px;
    }

    .filter-btn{
        background:#ececec;
        color:#444;
        padding:10px 14px;
        border-radius:999px;
        font-size:14px;
        font-weight:700;
    }

    .filter-btn.active{
        background:#5b4ce6;
        color:#fff;
    }

    .oglas-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:18px;
    }

    .badge{
        background:#efeaff;
        color:#5b4ce6;
        padding:6px 10px;
        border-radius:999px;
        font-size:13px;
        font-weight:700;
    }

    .oglas-card{
        border:1px solid #e7e7e7;
        border-radius:18px;
        padding:16px;
        margin-bottom:16px;
        background:#fafafa;
    }

    .oglas-card.neaktivan{
        opacity:.72;
        border:1px solid #ffb4b4;
        background:#fff3f3;
    }

    .oglas-link{
        font-size:17px;
        font-weight:700;
        color:#483dff;
        text-decoration:none;
    }

    .status{
        margin-top:8px;
        display:inline-block;
        padding:6px 10px;
        border-radius:999px;
        font-size:12px;
        font-weight:700;
    }

    .status.active{
        background:#e8fff1;
        color:#138a47;
    }

    .status.inactive{
        background:#ffe3e3;
        color:#d92d20;
    }

    .cena{
        color:#0a8f3d;
        font-size:18px;
        font-weight:800;
        margin-top:8px;
    }

    .stara-cena{
        margin-top:6px;
        font-size:14px;
        color:#666;
    }

    .pad{
        color:#d92d20;
        font-weight:700;
    }

    .rast{
        color:#0a8f3d;
        font-weight:700;
    }

    .datum{
        margin-top:8px;
        color:#666;
        font-size:14px;
    }

    .delete-btn{
        background:#ffdede;
        color:#e02424;
        height:44px;
        min-width:86px;
    }

    .empty{
        color:#777;
    }

    @media(max-width:640px){
        body{
            padding:14px;
        }

        .oglas-flex{
            flex-direction:column;
        }

        .delete-btn{
            width:100%;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🚗 Auto Drukara</h1>

    <div class="subtitle">
        Prati cene polovnih automobila i dobij obaveštenje kada cena padne.
    </div>

    <div class="box">
        <input
            id="url"
            type="text"
            placeholder="https://www.polovniautomobili.com/auto-oglasi/..."
        >

        <input
            id="label"
            type="text"
            placeholder="Naziv oglasa, opciono"
        >

        <button class="primary-btn" onclick="dodajOglas()">
            Dodaj oglas
        </button>
    </div>

    <div class="box">

        <div class="oglas-header">
            <h2>Praćeni oglasi</h2>
            <div class="badge" id="count">0</div>
        </div>

        <div class="filter-wrap">
            <button class="filter-btn active" onclick="setFilter('all', this)">Svi</button>
            <button class="filter-btn" onclick="setFilter('active', this)">Aktivni</button>
            <button class="filter-btn" onclick="setFilter('inactive', this)">Nestali</button>
            <button class="filter-btn" onclick="setFilter('changes', this)">Sa promenom</button>
        </div>

        <div id="oglasi"></div>

    </div>

</div>

<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

let CURRENT_FILTER = "all";
let GLOBAL_DATA = null;

function formatCena(cena){
    if(!cena) return "N/A";
    return new Intl.NumberFormat("sr-RS").format(cena) + " €";
}

function setFilter(filter, btn){
    CURRENT_FILTER = filter;

    document.querySelectorAll(".filter-btn")
        .forEach(x => x.classList.remove("active"));

    btn.classList.add("active");

    render();
}

async function ucitaj(){
    const res = await fetch(API + "/data");
    GLOBAL_DATA = await res.json();
    render();
}

function render(){

    const wrapper = document.getElementById("oglasi");

    const oglasi = GLOBAL_DATA?.oglasi || [];
    const cene = GLOBAL_DATA?.cene || {};

    let filtrirani = oglasi.filter(oglas => {

        const item = cene[oglas.url] || {};

        if(CURRENT_FILTER === "active"){
            return item.aktivan !== false;
        }

        if(CURRENT_FILTER === "inactive"){
            return item.aktivan === false;
        }

        if(CURRENT_FILTER === "changes"){
            return item.prethodna_cena;
        }

        return true;
    });

    document.getElementById("count").innerText = filtrirani.length;

    if(!filtrirani.length){
        wrapper.innerHTML = `<div class="empty">Nema oglasa.</div>`;
        return;
    }

    wrapper.innerHTML = "";

    filtrirani.forEach(oglas => {

        const item = cene[oglas.url] || {};
        const prikazNaziva = oglas.label || item.label || "Oglas bez naziva";

        let promenaHtml = "";

        if(item.prethodna_cena){

            if(item.promena_tip === "snizenje"){

                promenaHtml = `
                    <div class="stara-cena">
                        Pre: ${formatCena(item.prethodna_cena)}
                        <span class="pad">
                            ↓ ${formatCena(Math.abs(item.promena))}
                        </span>
                    </div>
                `;

            } else if(item.promena_tip === "povecanje"){

                promenaHtml = `
                    <div class="stara-cena">
                        Pre: ${formatCena(item.prethodna_cena)}
                        <span class="rast">
                            ↑ ${formatCena(item.promena)}
                        </span>
                    </div>
                `;

            } else {

                promenaHtml = `
                    <div class="stara-cena">
                        Pre: ${formatCena(item.prethodna_cena)}
                    </div>
                `;
            }

        } else {

            promenaHtml = `
                <div class="stara-cena">
                    Nema zabeležene promene
                </div>
            `;
        }

        const statusHtml = item.aktivan === false
            ? `<div class="status inactive">Oglas više nije aktivan</div>`
            : `<div class="status active">Aktivan oglas</div>`;

        wrapper.innerHTML += `
            <div class="oglas-card ${item.aktivan === false ? 'neaktivan' : ''}">

                ${item.slika ? `
                    <img
                        src="${item.slika}"
                        alt="${prikazNaziva}"
                        style="
                            width:100%;
                            height:180px;
                            object-fit:cover;
                            border-radius:14px;
                            margin-bottom:14px;
                        "
                    >
                ` : ""}

                <div class="oglas-flex" style="display:flex;justify-content:space-between;gap:12px;">

                    <div style="flex:1;">

                        <a href="${oglas.url}"
                           target="_blank"
                           class="oglas-link">
                           ${prikazNaziva}
                        </a>

                        ${statusHtml}

                        <div class="cena">
                            ${formatCena(item.cena)}
                        </div>

                        ${promenaHtml}

                        <div class="datum">
                            Poslednja provera:
                            ${item.poslednja_provera || "-"}
                        </div>

                    </div>

                    <button class="delete-btn"
                            onclick="obrisiOglas('${oglas.url}')">
                        Obriši
                    </button>

                </div>
            </div>
        `;
    });
}

async function dodajOglas(){

    const url = document.getElementById("url").value.trim();
    const label = document.getElementById("label").value.trim();

    if(!url){
        alert("Unesi URL oglasa.");
        return;
    }

    await fetch(API + "/add", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            url,
            label
        })
    });

    document.getElementById("url").value = "";
    document.getElementById("label").value = "";

    ucitaj();
}

async function obrisiOglas(url){

    await fetch(API + "/delete", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({ url })
    });

    ucitaj();
}

ucitaj();
</script>

</body>
</html>
