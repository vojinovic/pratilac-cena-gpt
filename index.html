<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pratilac cena v2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f4f5;
      font-family: Arial, sans-serif;
      color: #18181b;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #71717a;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #e4e4e7;
    }

    .card-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d4d4d8;
      margin-top: 8px;
      margin-bottom: 16px;
      font-size: 16px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-add {
      background: #4f46e5;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
    }

    .btn-add:hover {
      background: #4338ca;
    }

    .oglasi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .badge {
      background: #ede9fe;
      color: #6d28d9;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .oglas {
      border: 1px solid #e4e4e7;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      background: #fafafa;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .oglas:last-child {
      margin-bottom: 0;
    }

    .oglas-left {
      flex: 1;
    }

    .oglas a {
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      color: #4338ca;
    }

    .oglas a:hover {
      text-decoration: underline;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #15803d;
      margin-top: 6px;
    }

    .muted {
      color: #71717a;
      font-size: 14px;
      margin-top: 4px;
    }

    .btn-delete {
      background: #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 12px;
      height: fit-content;
    }

    .btn-delete:hover {
      background: #fca5a5;
    }

    .empty {
      color: #71717a;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🚗 Pratilac cena</h1>
    <div class="subtitle">
      Dodaj, prati i briši oglase bez GitHub tokena u browseru.
    </div>

    <div class="card">

      <label>URL oglasa</label>
      <input
        id="url"
        placeholder="https://www.polovniautomobili.com/auto-oglasi/..."
      />

      <label>Naziv oglasa</label>
      <input
        id="label"
        placeholder="npr. Volvo XC60 beli iz Novog Sada"
      />

      <button class="btn-add" onclick="dodajOglas()">
        Dodaj oglas
      </button>

    </div>

    <div class="card">

      <div class="oglasi-header">
        <div style="font-size: 28px; font-weight: bold;">
          Praćeni oglasi
        </div>

        <div class="badge" id="broj-oglasa">
          0
        </div>
      </div>

      <div id="oglasi">
        <div class="empty">Učitavanje...</div>
      </div>

    </div>

  </div>

  <script>
    const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

    function formatCena(cena) {
      if (!cena) return "N/A";

      return cena.toLocaleString("sr-RS") + " €";
    }

    async function ucitaj() {
      const wrap = document.getElementById("oglasi");

      wrap.innerHTML = `<div class="empty">Učitavanje...</div>`;

      try {
        const res = await fetch(API);
        const data = await res.json();

        render(data);

      } catch (e) {
        wrap.innerHTML = `<div class="empty">Greška pri učitavanju.</div>`;
      }
    }

    function render(data) {
      const wrap = document.getElementById("oglasi");

      const oglasi = data.oglasi || [];
      const cene = data.cene || {};

      document.getElementById("broj-oglasa").innerText = oglasi.length;

      if (!oglasi.length) {
        wrap.innerHTML = `<div class="empty">Nema oglasa.</div>`;
        return;
      }

      wrap.innerHTML = oglasi.map(o => {
        const info = cene[o.url] || {};

        const cena = info.cena;
        const vreme = info.poslednja_provera;

        return `
          <div class="oglas">

            <div class="oglas-left">

              <a href="${o.url}" target="_blank">
                ${o.label}
              </a>

              <div class="price">
                ${formatCena(cena)}
              </div>

              ${
                info.prethodna_cena && info.promena
                  ? `
                    <div class="muted">
                      Prethodno: ${formatCena(info.prethodna_cena)}
                      ${
                        info.promena_tip === "snizenje"
                          ? ` | Sniženo za: ${formatCena(info.promena)}`
                          : ` | Povećano za: ${formatCena(info.promena)}`
                      }
                    </div>

                    <div class="muted">
                      Promena: ${info.datum_promene || ""}
                    </div>
                  `
                  : `
                    <div class="muted">
                      Nema zabeležene promene
                    </div>
                  `
              }

              <div class="muted">
                ${
                  vreme
                    ? "Poslednja provera: " + vreme
                    : "Još nije provereno"
                }
              </div>

            </div>

            <button
              class="btn-delete"
              onclick="obrisiOglas('${o.url}')"
            >
              Obriši
            </button>

          </div>
        `;
      }).join("");
    }

    async function dodajOglas() {
      const url = document.getElementById("url").value.trim();
      const label = document.getElementById("label").value.trim();

      if (!url || !label) {
        alert("Unesi URL i naziv.");
        return;
      }

      try {
        await fetch(API + "/add", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url,
            label
          })
        });

        document.getElementById("url").value = "";
        document.getElementById("label").value = "";

        ucitaj();

      } catch (e) {
        alert("Greška.");
      }
    }

    async function obrisiOglas(url) {
      if (!confirm("Obriši oglas?")) {
        return;
      }

      try {
        await fetch(API + "/delete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url
          })
        });

        ucitaj();

      } catch (e) {
        alert("Greška.");
      }
    }

    ucitaj();
  </script>
</body>
</html>
