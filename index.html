<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<title>Pratilac Cena</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

/* FILTERI */
.filter-btn {
    padding: 6px 10px;
    margin-right: 5px;
    cursor: pointer;
    border: 1px solid #ddd;
    background: white;
    border-radius: 6px;
}

.filter-btn.active {
    background: black;
    color: white;
}

/* TOP SECTION */
#topDeals {
    margin-top: 20px;
    margin-bottom: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
}

/* LIST */
#list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
}

/* TITLE */
.section-title {
    margin-top: 30px;
    font-weight: bold;
    font-size: 16px;
    color: #333;
}

/* CARD */
.card, .top-card {
    background: white;
    border-radius: 12px;
    padding: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.top-card {
    border: 2px solid #ffb100;
    background: #fffdf6;
    transform: scale(1.02);
}

/* IMAGE */
.card img, .top-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

/* TEXT */
.price {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
}

.meta {
    font-size: 12px;
    color: #666;
    margin-top: 5px;
}

.badge {
    font-size: 12px;
    font-weight: bold;
    color: #ff3b30;
    margin: 5px 0;
}
</style>
</head>

<body>

<h2>🚗 Praceni oglasi</h2>

<!-- FILTER -->
<div>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Svi</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Aktivni</button>
    <button class="filter-btn" data-filter="inactive" onclick="setFilter('inactive')">Nestali</button>
    <button class="filter-btn" data-filter="changes" onclick="setFilter('changes')">Sa promenom</button>
</div>

<!-- TOP DEALS -->
<div id="topDeals"></div>

<!-- FULL LIST TITLE -->
<div class="section-title">📊 Svi oglasi</div>

<!-- LIST -->
<div id="list"></div>

<script>
const API = "https://pratilac-cena-api.vojinovic82.workers.dev";

let DATA = {};
let FILTER = "all";

/* LOAD */
async function load(){
    try {
        const r = await fetch(API + "/data");
        DATA = await r.json();
        render();
    } catch (e) {
        console.error("API error:", e);
    }
}

/* FILTER */
function setFilter(f){
    FILTER = f;

    document.querySelectorAll(".filter-btn")
        .forEach(b => b.classList.remove("active"));

    const btn = document.querySelector(`[data-filter="${f}"]`);
    if (btn) btn.classList.add("active");

    render();
}

/* RENDER */
function render(){

    const oglasi = DATA?.oglasi || [];
    const cene = DATA?.cene || {};

    let list = oglasi.filter(o => {
        const c = cene[o.url] || {};

        if (FILTER === "active") return c.aktivan !== false;
        if (FILTER === "inactive") return c.aktivan === false;
        if (FILTER === "changes") return c.prethodna_cena;

        return true;
    });

    list.sort((a, b) => {
        return (cene[b.url]?.score || 0) - (cene[a.url]?.score || 0);
    });

    /* ================= TOP 3 ================= */
    const topContainer = document.getElementById("topDeals");

    if (topContainer) {
        topContainer.innerHTML = "";

        list.slice(0, 3).forEach(o => {
            const c = cene[o.url] || {};
            const score = c.score || 0;

            const div = document.createElement("div");
            div.className = "top-card";

            div.innerHTML = `
                <div class="badge">🔥 BEST DEAL</div>
                <img src="${c.slika || ""}" />
                <div><b>${o.label || "Oglas"}</b></div>
                <div class="price">${c.cena || "N/A"} €</div>
                <div class="meta">Score: ${score}/100</div>
                <a href="${o.url}" target="_blank">Otvori</a>
            `;

            topContainer.appendChild(div);
        });
    }

    /* ================= LIST ================= */
    const container = document.getElementById("list");

    if (!container) {
        console.error("Missing #list container");
        return;
    }

    container.innerHTML = "";

    list.forEach(o => {
        const c = cene[o.url] || {};
        const score = c.score || 0;

        let badge = "⚪";
        if (score >= 80) badge = "🔥";
        else if (score >= 60) badge = "🟢";
        else if (score >= 40) badge = "🟡";
        else badge = "🔴";

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <img src="${c.slika || ""}" />

            <div><b>${o.label || "Oglas"} ${badge}</b></div>

            <div class="price">${c.cena || "N/A"} €</div>

            <div class="meta">
                Prva: ${c.prethodna_cena || "N/A"} €<br>
                Promena: ${c.promena || 0} €<br>
                Score: ${score}/100
            </div>

            <div class="meta">
                ${c.poslednja_provera || "-"}
            </div>

            <a href="${o.url}" target="_blank">Otvori</a>
        `;

        container.appendChild(div);
    });
}

/* INIT */
window.addEventListener("DOMContentLoaded", load);
</script>

</body>
</html>
